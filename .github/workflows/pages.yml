# Публикация сайта на GitHub Pages при каждом пуше в main.
# Что делает: сначала прогоняет тесты, проверяет синтаксис всех файлов и открывает приложение в настоящем браузере (Chromium, экран
# iPhone: запуск, чтение, слово, повторение, копия данных; если что-то не так, сайт не публикуется и на телефон ничего не попадает), потом подставляет в sw.js и js/build.js номер коммита (так телефон узнаёт, что вышла новая версия),
# а в sw.js ещё и отпечаток словаря (пока словарь не менялся, телефон не скачивает его заново), и выкладывает только файлы
# приложения и встроенные книги (books/), без .venv, tests, tools и data-src.
#
# Один раз включить: репозиторий на GitHub → Settings → Pages → Source: «GitHub Actions».
name: Опубликовать приложение

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Проверка: те же тесты, что вы запускаете у себя (npm test и npm run test:dict), плюс разбор каждого файла JavaScript.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты JavaScript
        run: npm test

      - name: Синтаксис всех файлов JavaScript
        run: |
          for f in sw.js $(find js -name '*.js'); do
            node --check "$f" || exit 1
          done

      - name: Тесты Python (словарь, частотный список и каталог книг)
        run: python3 -m unittest tests/test_build_dict.py tests/test_translate_glosses.py tests/test_build_catalog.py tests/test_build_freq.py

      # Приложение целиком в настоящем браузере (tests/e2e/smoke.py): то же, что у вас npm run test:e2e. Один повтор на случай,
      # если браузер на только что запущенной машине «моргнул»: настоящая поломка упадёт и со второго раза.
      - name: Проверка в браузере (Chromium, экран iPhone)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/e2e/smoke.py || { echo "Первый запуск не прошёл, повторяю один раз"; python3 tests/e2e/smoke.py; }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Встроенные книги: список и обложки собираются из EPUB в папке books/ (если она есть).
      # Pillow уменьшает обложки; без него обложки просто берутся как есть или пропускаются.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать каталог книг
        run: |
          pip install pillow || true
          mkdir -p books
          python3 tools/build_catalog.py

      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          cp -r books _site/books
          rm -f _site/books/README.md _site/books/groups.json
          DICT=$(sha256sum _site/data/dict.json | cut -c1-10)
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js _site/js/build.js
          sed -i "s/__DICT__/${DICT}/" _site/sw.js
          if grep -q "__BUILD__\|__DICT__" _site/sw.js _site/js/build.js; then echo "Маркер версии или словаря не заменён" && exit 1; fi
          grep -n "const BUILD\|const DICT =" _site/sw.js _site/js/build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
